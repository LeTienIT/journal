<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css"/>
  <title>Nhật ký bé con</title>
</head>
<body>

  <div class="loading" id="loading">Đang tải nhật ký...</div>
  <canvas id="canvas"></canvas>

  <div class="top-right">
    <button class="icon-btn" id="selectDayBtn" title="Chọn ngày">☰</button>
    <button class="icon-btn" id="musicBtn" title="Nhạc">♪</button>
  </div>

  <button class="side-btn" id="prevBtn">‹</button>
  <button class="side-btn" id="nextBtn">›</button>

  <div class="container">
    <div class="day-header" id="dayHeader">—</div>
    <div class="diary" id="diary">
      <div class="day-loading" id="dayLoading">Đang tải ngày này...</div>
    </div>
  </div>

  <div class="modal-overlay" id="dayModal">
    <div class="modal">
      <div class="modal-title">Chọn ngày</div>
      <div id="dayList"></div>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <!-- <source src="music.mp3" type="audio/mpeg"> -->
  </audio>

  <script src="script.js"></script>
</body>
</html>
