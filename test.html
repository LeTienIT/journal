<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nhật ký trong bóng tối</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: #e8e0d5;
      font-family: "Georgia", "Times New Roman", serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ========== TRANG MẬT KHẨU ========== */
    #passwordGate {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #passwordGate.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-heart {
      width: 90px;
      height: 90px;
      margin-bottom: 40px;
      position: relative;
      animation: heartbeat 1.4s ease-in-out infinite;
      transition: filter 0.6s ease, opacity 0.6s ease;
    }
    .gate-heart svg {
      width: 100%;
      height: 100%;
      fill: #ff8a9a;
      filter: drop-shadow(0 0 12px rgba(255, 140, 160, 0.6));
      transition: fill 0.6s ease, filter 0.6s ease;
    }
    .gate-heart.darken svg {
      fill: #5a3a40;
      filter: drop-shadow(0 0 4px rgba(80, 40, 50, 0.3));
    }
    .gate-heart.very-dark svg {
      fill: #2a1a1e;
      filter: none;
      opacity: 0.5;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
      60% { transform: scale(1); }
    }

    .gate-title {
      color: #c9b8a0;
      font-size: 1.1rem;
      letter-spacing: 3px;
      margin-bottom: 28px;
      opacity: 0.85;
    }

    .password-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 280px;
      padding: 0 20px;
    }

    #passwordInput {
      width: 100%;
      padding: 14px 18px;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid #444;
      border-radius: 30px;
      color: #e8e0d5;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.3s;
    }
    #passwordInput:focus {
      border-color: #ff8a9a;
    }
    #passwordInput::placeholder {
      color: #666;
      letter-spacing: 1px;
    }

    #submitPass {
      width: 100%;
      padding: 13px;
      background: rgba(255, 138, 154, 0.15);
      border: 1px solid #ff8a9a;
      border-radius: 30px;
      color: #ff8a9a;
      font-size: 0.95rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.25s;
    }
    #submitPass:active {
      transform: scale(0.97);
      background: rgba(255, 138, 154, 0.25);
    }

    .gate-hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 1px;
    }

    /* ========== TRANG CHÍNH ========== */
    #mainApp {
      display: none;
      height: 100%;
      height: 100dvh;
    }
    #mainApp.show {
      display: block;
    }

    .container {
      position: relative;
      z-index: 10;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .day-header {
      font-size: clamp(1.05rem, 3.8vw, 1.3rem);
      letter-spacing: 1.2px;
      color: #c9b8a0;
      margin: 8px 0 14px;
      opacity: 0.95;
      text-align: center;
      transition: opacity 0.4s ease;
      flex-shrink: 0;
      padding: 0 56px;
      line-height: 1.4;
      word-break: break-word;
    }

    .diary {
      flex: 1;
      width: 100%;
      max-width: 620px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 12px 100px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: relative;
    }
    .diary::-webkit-scrollbar { display: none; }

    .line {
      font-size: clamp(0.98rem, 3.7vw, 1.12rem);
      line-height: 1.85;
      margin-bottom: 15px;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .highlight {
      background-color: var(--hl-color);
      padding: 1px 4px;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .end-marker {
      text-align: center;
      color: #555;
      font-size: 0.9rem;
      letter-spacing: 3px;
      margin: 32px 0 20px;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .end-marker.visible { opacity: 0.5; }

    .day-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 5, 0.7);
      color: #c9b8a0;
      font-size: 0.95rem;
      letter-spacing: 1px;
      z-index: 5;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .day-loading.show {
      opacity: 1;
      visibility: visible;
    }

    .side-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(18, 18, 18, 0.88);
      border: 1px solid #3a3a3a;
      color: #c9b8a0;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }
    .side-btn:active { transform: translateY(-50%) scale(0.9); }
    #prevBtn { left: max(10px, env(safe-area-inset-left)); }
    #nextBtn { right: max(10px, env(safe-area-inset-right)); }

    .top-right {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 40;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(18, 18, 18, 0.88);
      border: 1px solid #3a3a3a;
      color: #c9b8a0;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }
    .icon-btn:active { transform: scale(0.9); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #111;
      width: 100%;
      max-width: 500px;
      max-height: 75vh;
      border-radius: 18px 18px 0 0;
      padding: 18px 14px 28px;
      transform: translateY(100%);
      transition: transform 0.35s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-overlay.active .modal { transform: translateY(0); }

    .modal-title {
      text-align: center;
      color: #c9b8a0;
      font-size: 1.05rem;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .day-item {
      padding: 13px 14px;
      border-radius: 10px;
      color: #ddd;
      font-size: 1rem;
      margin-bottom: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .day-item:active,
    .day-item.active {
      background: rgba(255, 255, 255, 0.09);
      color: #f0c8c8;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 180, 180, 0.25);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes rippleAnim {
      to { transform: scale(4.5); opacity: 0; }
    }

    .fade-out { animation: fadeOut 0.3s ease forwards; }
    .fade-in  { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(8px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      z-index: 200;
      color: #c9b8a0;
      font-size: 1.05rem;
      letter-spacing: 2px;
    }

    @media (max-width: 400px) {
      .day-header { padding: 0 52px; font-size: 1rem; }
      .icon-btn { width: 38px; height: 38px; }
      .side-btn { width: 40px; height: 40px; }
      .gate-heart { width: 80px; height: 80px; }
    }
  </style>
</head>
<body>

  <!-- CANVAS nền chung -->
  <canvas id="canvas"></canvas>

  <!-- ========== TRANG MẬT KHẨU ========== -->
  <div id="passwordGate">
    <div class="gate-heart" id="gateHeart">
      <svg viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
    <div class="gate-title">NHẬT KÝ</div>
    <div class="password-box">
      <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
      <button id="submitPass">Vào</button>
    </div>
    <div class="gate-hint">Chỉ dành cho người được phép đọc</div>
  </div>

  <!-- ========== TRANG CHÍNH ========== -->
  <div id="mainApp">
    <div class="top-right">
      <button class="icon-btn" id="selectDayBtn" title="Chọn ngày">☰</button>
      <button class="icon-btn" id="musicBtn" title="Nhạc">♪</button>
    </div>

    <button class="side-btn" id="prevBtn">‹</button>
    <button class="side-btn" id="nextBtn">›</button>

    <div class="container">
      <div class="day-header" id="dayHeader">—</div>
      <div class="diary" id="diary">
        <div class="day-loading" id="dayLoading">Đang tải ngày này...</div>
      </div>
    </div>

    <div class="modal-overlay" id="dayModal">
      <div class="modal">
        <div class="modal-title">Chọn ngày</div>
        <div id="dayList"></div>
      </div>
    </div>
  </div>

  <div class="loading" id="loading" style="display:none;">Đang tải nhật ký...</div>

  <audio id="bgMusic" loop preload="auto">
    <!-- <source src="music.mp3" type="audio/mpeg"> -->
  </audio>

  <script>
    // ====================== CẤU HÌNH MẬT KHẨU ======================
    // Đổi mật khẩu tại đây
    const CORRECT_PASSWORD = "becoi";   // ← đổi thành mật khẩu bạn muốn

    let wrongAttempts = 0;

    // ====================== BIẾN CHUNG ======================
    let fileList = [];
    let cache = {};
    let currentIndex = 0;
    let highlights = {};
    let isLoadingDay = false;
    let isMusicPlaying = false;

    const passwordGate = document.getElementById("passwordGate");
    const gateHeart    = document.getElementById("gateHeart");
    const passwordInput= document.getElementById("passwordInput");
    const submitPass   = document.getElementById("submitPass");
    const mainApp      = document.getElementById("mainApp");

    const diaryEl      = document.getElementById("diary");
    const dayHeader    = document.getElementById("dayHeader");
    const dayLoading   = document.getElementById("dayLoading");
    const prevBtn      = document.getElementById("prevBtn");
    const nextBtn      = document.getElementById("nextBtn");
    const musicBtn     = document.getElementById("musicBtn");
    const selectDayBtn = document.getElementById("selectDayBtn");
    const dayModal     = document.getElementById("dayModal");
    const dayListEl    = document.getElementById("dayList");
    const loadingEl    = document.getElementById("loading");
    const bgMusic      = document.getElementById("bgMusic");

    // ====================== XỬ LÝ MẬT KHẨU ======================
    function checkPassword() {
      const input = passwordInput.value.trim();

      if (input === CORRECT_PASSWORD) {
        // Đúng → vào trang chính
        passwordGate.classList.add("hide");
        setTimeout(() => {
          passwordGate.style.display = "none";
          mainApp.classList.add("show");
          initMainApp(); // bắt đầu load nhật ký
        }, 700);
      } else {
        // Sai → trái tim tối dần
        wrongAttempts++;
        passwordInput.value = "";
        passwordInput.placeholder = "Sai rồi...";

        if (wrongAttempts === 1) {
          gateHeart.classList.add("darken");
        } else if (wrongAttempts >= 2) {
          gateHeart.classList.remove("darken");
          gateHeart.classList.add("very-dark");
        }

        // Rung nhẹ
        passwordInput.style.borderColor = "#ff6b6b";
        setTimeout(() => {
          passwordInput.style.borderColor = "#444";
          passwordInput.placeholder = "Nhập mật khẩu...";
        }, 1200);
      }
    }

    submitPass.addEventListener("click", checkPassword);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPassword();
    });

    // ====================== HIGHLIGHT ======================
    async function loadHighlights() {
      try {
        const res = await fetch("highlights.json");
        if (res.ok) highlights = await res.json();
      } catch (e) {}
    }

    function applyHighlight(text) {
      if (!highlights || Object.keys(highlights).length === 0) return text;
      let result = text;
      const words = Object.keys(highlights).sort((a, b) => b.length - a.length);
      words.forEach(word => {
        const color = highlights[word];
        const regex = new RegExp(`(${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, "gi");
        result = result.replace(regex, `<span class="highlight" style="--hl-color:${color}40">$1</span>`);
      });
      return result;
    }

    function parseTempTitle(filename) {
      const base = filename.replace(/^.*[\\/]/, "").replace(/\.txt$/i, "");
      if (/^\d{6}$/.test(base)) {
        const yy = base.slice(0, 2), mm = base.slice(2, 4), dd = base.slice(4, 6);
        return `${dd}/${mm}/20${yy}`;
      }
      if (/^\d{7,}$/.test(base)) {
        const last6 = base.slice(-6);
        const yy = last6.slice(0, 2), mm = last6.slice(2, 4), dd = last6.slice(4, 6);
        return `${dd}/${mm}/20${yy}`;
      }
      return base;
    }

    // ====================== LAZY LOAD ======================
    async function loadFile(index) {
      if (cache[index]) return cache[index];
      const fullName = fileList[index].endsWith(".txt") ? fileList[index] : fileList[index] + ".txt";
      const res = await fetch(fullName);
      if (!res.ok) throw new Error("Không tải được file");
      const text = await res.text();
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) throw new Error("File trống");
      const data = { date: lines[0], lines: lines.slice(1) };
      cache[index] = data;
      return data;
    }

    function renderEntry(data) {
      dayHeader.textContent = data.date;
      const oldLines = diaryEl.querySelectorAll(".line, .end-marker");
      oldLines.forEach(el => el.remove());

      data.lines.forEach(text => {
        const div = document.createElement("div");
        div.className = "line";
        div.innerHTML = applyHighlight(text);
        diaryEl.appendChild(div);
      });

      const end = document.createElement("div");
      end.className = "end-marker";
      end.textContent = "— hết —";
      diaryEl.appendChild(end);

      diaryEl.scrollTop = 0;

      const items = diaryEl.querySelectorAll(".line, .end-marker");
      const observer = new IntersectionObserver((obs) => {
        obs.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
      }, { root: diaryEl, threshold: 0.1 });
      items.forEach(el => observer.observe(el));

      setTimeout(() => {
        items.forEach((el, i) => { if (i < 5) el.classList.add("visible"); });
      }, 40);
    }

    async function goToDay(index) {
      if (index < 0 || index >= fileList.length || isLoadingDay) return;
      if (index === currentIndex && cache[index]) return;

      isLoadingDay = true;
      currentIndex = index;
      if (!cache[index]) dayLoading.classList.add("show");

      try {
        const data = await loadFile(index);
        renderEntry(data);
        updateDayListActive();
      } catch (err) {
        dayHeader.textContent = "Lỗi tải ngày này";
      } finally {
        dayLoading.classList.remove("show");
        isLoadingDay = false;
      }
    }

    function changeDay(direction) {
      goToDay(currentIndex + direction);
    }

    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); changeDay(-1); });
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); changeDay(1); });

    // Modal
    function buildDayList() {
      dayListEl.innerHTML = "";
      fileList.forEach((filename, i) => {
        const item = document.createElement("div");
        item.className = "day-item" + (i === currentIndex ? " active" : "");
        item.textContent = cache[i] ? cache[i].date : parseTempTitle(filename);
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          closeModal();
          goToDay(i);
        });
        dayListEl.appendChild(item);
      });
    }
    function updateDayListActive() {
      document.querySelectorAll(".day-item").forEach((el, i) => {
        el.classList.toggle("active", i === currentIndex);
        if (cache[i]) el.textContent = cache[i].date;
      });
    }
    function openModal() { buildDayList(); dayModal.classList.add("active"); }
    function closeModal() { dayModal.classList.remove("active"); }

    selectDayBtn.addEventListener("click", (e) => { e.stopPropagation(); openModal(); });
    dayModal.addEventListener("click", (e) => { if (e.target === dayModal) closeModal(); });

    // Nhạc
    musicBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!bgMusic.querySelector("source") && !bgMusic.src) {
        alert("Hãy thêm file nhạc vào thẻ <audio> trước!");
        return;
      }
      if (isMusicPlaying) {
        bgMusic.pause();
        musicBtn.textContent = "♪";
      } else {
        bgMusic.play().catch(() => {});
        musicBtn.textContent = "♫";
      }
      isMusicPlaying = !isMusicPlaying;
    });

    // ====================== CANVAS ======================
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let width, height;
    let hearts = [];
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    class Heart {
      constructor(x, y, size = null, speed = null) {
        this.x = x; this.y = y;
        this.size = size || (Math.random() * 10 + 5);
        this.speed = speed || (Math.random() * 0.65 + 0.22);
        this.opacity = Math.random() * 0.4 + 0.28;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.025;
        this.color = Math.random() > 0.5 ? "255,160,170" : "255,200,200";
      }
      update() {
        this.y -= this.speed;
        this.x += Math.sin(this.angle) * 0.3;
        this.angle += this.spin;
        this.opacity -= 0.0011;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = `rgba(${this.color},${this.opacity})`;
        ctx.beginPath();
        const s = this.size;
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-s/2, -s/2, -s, s/3, 0, s);
        ctx.bezierCurveTo(s, s/3, s/2, -s/2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5 + 0.4;
        this.speedY = Math.random() * 0.22 + 0.07;
        this.opacity = Math.random() * 0.3 + 0.1;
      }
      update() {
        this.y -= this.speedY;
        if (this.y < -10) {
          this.y = height + 10;
          this.x = Math.random() * width;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,230,220,${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) particles.push(new Particle());
    setInterval(() => {
      if (hearts.length < 20) hearts.push(new Heart(Math.random() * width, height + 15));
    }, 750);

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      for (let i = hearts.length - 1; i >= 0; i--) {
        hearts[i].update();
        hearts[i].draw();
        if (hearts[i].opacity <= 0 || hearts[i].y < -40) hearts.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }
    animate();

    // Ripple
    function createRipple(x, y) {
      const ripple = document.createElement("div");
      ripple.className = "ripple";
      const size = 60;
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (x - size/2) + "px";
      ripple.style.top = (y - size/2) + "px";
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          hearts.push(new Heart(
            x + (Math.random()-0.5)*40,
            y + (Math.random()-0.5)*25,
            Math.random()*8 + 6,
            Math.random()*1.3 + 0.6
          ));
        }, i * 45);
      }
    }
    function handlePointer(e) {
      if (e.target.closest("button") || e.target.closest(".modal") || e.target.closest(".top-right") || e.target.closest("#passwordGate")) return;
      const x = e.clientX ?? e.touches?.[0]?.clientX;
      const y = e.clientY ?? e.touches?.[0]?.clientY;
      if (x != null) createRipple(x, y);
    }
    document.body.addEventListener("click", handlePointer);
    document.body.addEventListener("touchstart", handlePointer, { passive: true });

    // ====================== KHỞI ĐỘNG TRANG CHÍNH ======================
    async function initMainApp() {
      loadingEl.style.display = "flex";
      try {
        await loadHighlights();
        const listRes = await fetch("list.json");
        if (!listRes.ok) throw new Error("Không tìm thấy list.json");
        fileList = await listRes.json();

        if (fileList.length === 0) {
          loadingEl.textContent = "Danh sách trống";
          return;
        }

        const firstData = await loadFile(0);
        loadingEl.style.display = "none";
        renderEntry(firstData);
      } catch (err) {
        loadingEl.textContent = "Lỗi: " + err.message;
      }
    }

    // Tự focus vào ô mật khẩu khi vào trang
    setTimeout(() => passwordInput.focus(), 300);
  </script>
</body>
</html>
